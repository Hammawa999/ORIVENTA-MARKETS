<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14">
<meta name="description" content="Your Oriventa Markets account."><title>Oriventa Markets | Dashboard</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="bar"><a class="brand" href="index.html" aria-label="Oriventa Markets home"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dd6a3"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M7 21l6-7 4 4 8-10" fill="none" stroke="#04131a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div>ORIVENTA<small>MARKETS</small></div></a>
<nav id="nav"><a href="index.html" data-p="index">Home</a><a href="signup.html#terms" data-p="terms">Terms</a><a href="login.html" data-p="login">Log in</a><a href="signup.html" class="cta" data-p="signup">Sign up</a></nav></div></header>
<main><section class="dash" id="dash" hidden>
<h1>Welcome, <span id="nm"></span></h1><p class="sub">You are logged in. Trading tools will appear here once they are connected.</p>
<div class="panel" style="margin:18px 0"><h3>Your account</h3><div class="kv" id="kv"></div></div>
<div class="panel"><h3>Linked wallets</h3><div class="kv" id="wl"></div></div>
<div class="btns"><button class="btn" id="out" type="button">Log out</button></div>
</section></main><footer>&copy; <span id="yr"></span> Oriventa Markets. All rights reserved. Digital asset trading involves substantial risk of loss.</footer>
<script src="app.js"></script>
<script>
const u=Store.currentUser();
if(!u){location.replace('login.html')}
else{
 const mask=a=>a.length>14?a.slice(0,6)+'...'+a.slice(-4):a;
 const row=(k,v)=>'<span>'+k+'</span><code>'+v.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</code>';
 document.getElementById('nm').textContent=u.fullName.split(' ')[0];
 document.getElementById('kv').innerHTML=row('Full name',u.fullName)+row('Username',u.username)+row('Email',u.email);
 document.getElementById('wl').innerHTML=row('Bitcoin (BTC)',mask(u.wallets.btc))+row('Ethereum (ETH)',mask(u.wallets.eth))+row('USDT (BEP20)',mask(u.wallets.usdtBep20))+row('USDT (TRC20)',mask(u.wallets.usdtTrc20));
 document.getElementById('dash').hidden=false;
 document.getElementById('out').addEventListener('click',()=>{Store.logout();location.href='login.html?out=1'});
}
</script>
</body></html>
